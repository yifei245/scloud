server:
  port: 9201
spring:
  application:
    name: scloud-auth
  profiles:
    active: dev
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active}.yml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        file-extension: yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:scloud}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Aa123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379} 
      password: ${REDIS_PASSWORD:Aa123456} 
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
scloud:
  auth:
    jwt-secret: ${JWT_SECRET:scloud-jwt-secret-must-be-at-least-32-bytes}
springdoc:
  packages-to-scan: com.scloud.auth.controller
  paths-to-match: /auth/**
  swagger-ui:
    enabled: false
